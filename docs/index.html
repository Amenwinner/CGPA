    <script>
      // 1. GitHub Pages SPA redirect handler (complements 404.html)
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // 2. Ensure trailing slash on GitHub Pages root subpaths so relative assets resolve properly
      (function() {
        var l = window.location;
        if (
          l.hostname.endsWith('github.io') &&
          l.pathname &&
          !l.pathname.endsWith('/') &&
          !l.pathname.split('/').pop().includes('.')
        ) {
          l.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
        }
      })();

      // 3. In accordance with AI Studio environment constraints: ignore WebSocket / HMR errors
      (function() {
        function isViteHmrError(msg, src) {
          var str = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
          return (
            str.includes('@vite/client') ||
            str.includes('vite:ws') ||
            str.includes('websocket') ||
            str.includes('ws://') ||
            str.includes('wss://') ||
            str.includes('connection refused')
          );
        }

        window.addEventListener('error', function(event) {
          var src = event.filename || (event.error && event.error.stack) || '';
          if (isViteHmrError(event.message, src)) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (isViteHmrError(msg, '')) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isViteHmrError(message, source || (error && error.stack))) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
        };
      })();
    </script>

        <div style="display: flex; gap: 6px; align-items: center;">
          <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6366f1; animation: pulse 1.5s infinite;"></span>
          <span style="font-size: 11px; color: #64748b; font-weight: 500;">Initializing academic environment</span>
        </div>
      </div>

    <script>
      // Fallback: If deployed to GitHub Pages without running Vite build, redirect to pre-built /docs/
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          setTimeout(function() {
            var spinner = document.getElementById('loading-spinner');
            if (spinner && document.body.contains(spinner)) {
              var path = window.location.pathname;
              if (!path.includes('/docs') && !path.includes('/dist')) {
                var target = path.replace(/\/$/, '') + '/docs/' + window.location.search + window.location.hash;
                window.location.replace(target);
              }
            }
          }, 1200);
        }
      })();
    </script>
